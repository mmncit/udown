<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>udown - YouTube Downloader</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f0f0f;
        color: #e1e1e1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .container {
        max-width: 700px;
        width: 100%;
        padding: 2rem 1.5rem;
      }
      h1 {
        font-size: 2rem;
        text-align: center;
        margin-bottom: 0.25rem;
        color: #ff4444;
      }
      .subtitle {
        text-align: center;
        color: #888;
        margin-bottom: 2rem;
        font-size: 0.9rem;
      }
      .input-group {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      input[type="text"] {
        flex: 1;
        padding: 0.75rem 1rem;
        border: 2px solid #333;
        border-radius: 8px;
        background: #1a1a1a;
        color: #e1e1e1;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s;
      }
      input[type="text"]:focus {
        border-color: #ff4444;
      }
      input[type="text"]::placeholder {
        color: #555;
      }
      select {
        padding: 0.75rem 1rem;
        border: 2px solid #333;
        border-radius: 8px;
        background: #1a1a1a;
        color: #e1e1e1;
        font-size: 1rem;
        cursor: pointer;
        outline: none;
      }
      select:focus {
        border-color: #ff4444;
      }
      .actions {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
      }
      button {
        padding: 0.75rem 1.5rem;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition:
          opacity 0.2s,
          transform 0.1s;
      }
      button:active {
        transform: scale(0.98);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }
      .btn-info {
        background: #333;
        color: #e1e1e1;
        flex: 1;
      }
      .btn-info:hover:not(:disabled) {
        background: #444;
      }
      .btn-download {
        background: #ff4444;
        color: #fff;
        flex: 2;
      }
      .btn-download:hover:not(:disabled) {
        background: #e03030;
      }
      .status {
        padding: 1rem;
        border-radius: 8px;
        margin-bottom: 1rem;
        display: none;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .status.error {
        display: block;
        background: #2a1515;
        border: 1px solid #ff4444;
        color: #ff8888;
      }
      .status.info {
        display: block;
        background: #152a15;
        border: 1px solid #44ff44;
        color: #88ff88;
      }
      .status.loading {
        display: block;
        background: #1a1a2a;
        border: 1px solid #4488ff;
        color: #88aaff;
      }
      .video-info {
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 1.25rem;
        margin-bottom: 1rem;
        display: none;
      }
      .video-info h3 {
        margin-bottom: 0.5rem;
        color: #fff;
        font-size: 1.1rem;
      }
      .video-info .meta {
        color: #888;
        font-size: 0.85rem;
      }
      .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        vertical-align: middle;
        margin-right: 0.5rem;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      footer {
        margin-top: auto;
        padding: 1.5rem;
        color: #555;
        font-size: 0.8rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>udown</h1>
      <p class="subtitle">Paste a YouTube link to download</p>

      <div class="input-group">
        <input
          type="text"
          id="url"
          placeholder="https://www.youtube.com/watch?v=..."
          autofocus
        />
        <select id="quality">
          <option value="best">Best Quality</option>
          <option value="1080">1080p</option>
          <option value="720">720p</option>
          <option value="audio">Audio Only (m4a)</option>
          <option value="mp3">MP3 (Audio)</option>
        </select>
      </div>

      <div class="actions">
        <button class="btn-info" id="infoBtn" onclick="fetchInfo()">
          Get Info
        </button>
        <button class="btn-download" id="downloadBtn" onclick="startDownload()">
          Download
        </button>
      </div>

      <div class="status" id="status"></div>

      <div class="video-info" id="videoInfo">
        <h3 id="videoTitle"></h3>
        <p class="meta" id="videoMeta"></p>
      </div>
    </div>

    <footer>udown &mdash; powered by yt-dlp + Rust</footer>

    <script>
      const urlInput = document.getElementById("url");
      const qualitySelect = document.getElementById("quality");
      const statusEl = document.getElementById("status");
      const videoInfoEl = document.getElementById("videoInfo");
      const infoBtn = document.getElementById("infoBtn");
      const downloadBtn = document.getElementById("downloadBtn");

      function showStatus(message, type) {
        statusEl.className = "status " + type;
        statusEl.innerHTML = message;
      }

      function clearStatus() {
        statusEl.className = "status";
        statusEl.innerHTML = "";
      }

      function setButtons(disabled) {
        infoBtn.disabled = disabled;
        downloadBtn.disabled = disabled;
      }

      async function fetchInfo() {
        const url = urlInput.value.trim();
        if (!url) {
          showStatus("Please enter a YouTube URL.", "error");
          return;
        }

        clearStatus();
        videoInfoEl.style.display = "none";
        setButtons(true);
        showStatus(
          '<span class="spinner"></span> Fetching video info...',
          "loading",
        );

        try {
          const resp = await fetch("/api/info?url=" + encodeURIComponent(url));
          const data = await resp.json();

          if (!resp.ok) {
            showStatus(data.error || "Failed to fetch info.", "error");
            return;
          }

          document.getElementById("videoTitle").textContent = data.title;
          const parts = [];
          if (data.duration) parts.push("Duration: " + data.duration);
          parts.push(data.formats.length + " formats available");
          document.getElementById("videoMeta").textContent = parts.join(" · ");
          videoInfoEl.style.display = "block";
          clearStatus();
        } catch (e) {
          showStatus("Network error: " + e.message, "error");
        } finally {
          setButtons(false);
        }
      }

      async function startDownload() {
        const url = urlInput.value.trim();
        if (!url) {
          showStatus("Please enter a YouTube URL.", "error");
          return;
        }

        clearStatus();
        setButtons(true);
        showStatus(
          '<span class="spinner"></span> Downloading... this may take a moment.',
          "loading",
        );

        try {
          const resp = await fetch("/api/download", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              url: url,
              quality: qualitySelect.value,
            }),
          });

          if (!resp.ok) {
            const data = await resp.json();
            showStatus(data.error || "Download failed.", "error");
            return;
          }

          const disposition = resp.headers.get("Content-Disposition");
          let filename = "video.mp4";
          if (disposition) {
            const match = disposition.match(/filename="?(.+?)"?$/);
            if (match) filename = match[1];
          }

          const blob = await resp.blob();
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(a.href);

          showStatus("Download complete!", "info");
        } catch (e) {
          showStatus("Network error: " + e.message, "error");
        } finally {
          setButtons(false);
        }
      }

      urlInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") startDownload();
      });
    </script>
  </body>
</html>
